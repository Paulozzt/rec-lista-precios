name: Actualizar precios

on:
  schedule:
    - cron: "0 9 * * 1"   # lunes 9:00 UTC = 6:00 en Argentina
  workflow_dispatch:      # botón para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bajar la hoja y generar precios.json
        env:
          SHEET_CSV_URL: ${{ secrets.SHEET_CSV_URL }}
        run: python scripts/actualizar_precios.py
      - name: Guardar si cambió
        run: |
          git config user.name "actualizador-precios"
          git config user.email "actions@users.noreply.github.com"
          git add data/precios.json
          git diff --cached --quiet || git commit -m "Precios actualizados $(date +%F)"
          git push
